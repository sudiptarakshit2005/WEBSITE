<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Sudipta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="nav">
            <a href="index.html" class="logo">SUDIPTA</a>
            <div class="nav-links">
                <a href="index.html#about">About</a>
                <a href="index.html#skills">Skills</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact-page">
            <div class="contact-page-content">
                <p class="eyebrow">03 — CONTACT</p>
                <h1>Let's connect<span>.</span></h1>
                <p class="contact-intro">
                    Have a question, idea, or just want to say hello?
                    Send me a message below.
                </p>

                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="6"
                            placeholder="Write your message"></textarea>
                    </div>

                    <button type="submit">Send Message <span>→</span></button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Sudipta. Built with HTML, CSS & JavaScript.</p>
        <a href="index.html">Back to home ↑</a>
    </footer>

    <script src="contact.js"></script>
</body>
</html>
